[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ethereum-code-reviewer"
version = "0.1.0"
description = "Automated security review of pull requests using LLMs"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.0",
    "PyGithub>=2.6.0",
    "requests>=2.32.3",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = ["ethereum_code_reviewer"]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=ethereum_code_reviewer --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["ethereum_code_reviewer"]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "raise ImportError",
]
